# log dir 
log_dir: ./logs/training

# model setting
pretrained: null
model_name: clip_bias   # model name for registry
backbone_name: vit      # backbone name

# Tuning strategy setting for CLIP Bias PEFT ablation
tuning:
  parameter_type: all_bias  # frozen, all_bias, linear_bias, ln_bias, attention_bias, qkv_bias, q_bias, k_bias, v_bias, attn_proj_bias, mlp_bias, mlp_fc1_bias, mlp_fc2_bias
  layer_range: all          # all, early, middle, late, or explicit e.g. "16-23"
  train_classifier: true
  include_pre_post_ln: true

# feature normalization
normalize_features: true

# Manipulation-Invariant Bias Subspace (MIBS) Regularization
bias_subspace:
  enabled: false
  path: null
  lambda: 0.01
  rank: 2
  method: shared_svd

# Subspace estimation settings
bias_subspace_estimation:
  batches_per_method: 25
  balanced_real_fake: true
  method: shared_svd  # shared_svd, mean_direction, balanced_subspace
  rank: 2
  seed: 1024
  balanced_subspace:
    rank: 2
    beta: 1.0
    lr: 0.01
    steps: 1000
    seed: 1024
    objective: mean_variance  # mean_variance, soft_min
    temperature: 0.1

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
test_dataset: [Celeb-DF-v2]
dataset_type: pair  # pairDataset: pairs each fake frame with source real frame for 50/50 balance

compression: c23  # compression-level for videos
train_batchSize: 8   # 8 pairs -> collates into 16 images per step (8 real + 8 fake, fits 15GB GPU)
test_batchSize: 16   # test batch size
workers: 4   # number of data loading workers
frame_num: {'train': 8, 'test': 32}   # number of frames to use per video in training and testing
resolution: 224   # resolution of output image to network
with_mask: false   # whether to include mask information in the input
with_landmark: false   # whether to include facial landmark information in the input

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# mean and std for normalization
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005

# training config
lr_scheduler: null
nEpochs: 10
start_epoch: 0
save_epoch: 1
rec_iter: 100
manualSeed: 1024
save_ckpt: true
save_feat: false

# loss function
loss_func: cross_entropy
losstype: null

# metric
metric_scoring: auc

# cuda
cuda: true
cudnn: true
save_avg: true
