# log dir
log_dir: ./zhiyuanyan/logs/benchv2/icml25/release

# model setting
pretrained: 'no need to provide this for the effort model'
model_name: gend_effort
backbone_name: vit

# ============================================================
# Loss settings: BCE + Asymmetric SupCon
# ============================================================

# Tổng loss:
# L = L_BCE + lambda_supcon * L_AsymSupCon
lambda_supcon: 0.05          # không nên để 0.3 lúc đầu, dễ làm contrastive dominate

# Asymmetric SupCon
temperature: 0.07
base_temperature: 0.07
contrast_mode: all

real_label: 0
lambda_fake: 0.1             # hệ số fake-real repulsion bên trong AsymSupCon
fake_margin: 0.0             # ép cos(fake, real) <= 0

# BCE class weight
weight_real: 1.0
weight_fake: 2.0             # fake = positive class, dùng pos_weight = 2.0

# BCEWithLogitsLoss không dùng label_smoothing trực tiếp
label_smoothing: 0.0

# Projection head cho contrastive loss
feature_dim: 1024
projection_dim: 256

# Fine-tuning setting
last_k_blocks: 2             # mở 2 transformer blocks cuối của CLIP ViT

# backbone setting
backbone_config:
  mode: original
  num_classes: 2
  inc: 3
  dropout: false

# dataset
dataset_type: pair
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
test_dataset: [Celeb-DF-v2, FaceShifter, DeeperForensics-1.0]

compression: c23
train_batchSize: 64
test_batchSize: 128
workers: 8
frame_num:
  train: 8
  test: 32
resolution: 224
with_mask: false
with_landmark: false

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# CLIP mean/std
mean: [0.48145466, 0.4578275, 0.40821073]
std:  [0.26862954, 0.26130258, 0.27577711]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.0001              # 0.0003 hơi cao nếu mở last_k_blocks
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false

# training config
lr_scheduler: cosine
lr_T_max: 10
lr_eta_min: 0.000001
nEpochs: 15
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: /kaggle/tmp/logs
manualSeed: 1024
save_ckpt: true
save_feat: true
save_avg: true

# loss function
loss_func: asym_supcon
losstype: bce_asym_supcon

# metric
metric_scoring: auc

# cuda
ngpu: 1
cuda: true
cudnn: true
